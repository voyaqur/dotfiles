[main]
launch-prefix=uwsm-app --
font=JetBrainsMono Nerd Font:size=11
prompt="> "
icon-theme=Papirus
icons-enabled=yes
fields=filename,name,generic,exec,keywords
show-actions=yes
terminal=ghostty       # Change to your preferred terminal (e.g., ghostty, kitty, alacritty)
lines=8
width=40
horizontal-pad=20
vertical-pad=12
inner-pad=5
image-size-ratio=0.6
line-height=20

# Positioning on screen
anchor=center
lines-spacing=4

[colors]
# Format: RRGGBBAA (RGB + Alpha transparency)
background=073642ff
text=839496ff
prompt=93a1a1ff
placeholder=586e75ff
input=839496ff
match=cb4b16ff
selection=002b36ff
selection-text=2aa198ff
selection-match=cb4b16ff
counter=586e75ff
border=2aa198ff

[border]
width=2
radius=2

[dmenu]
mode=text              # "text" or "index"
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+c
execute=Return KP_Enter
execute-or-paste=Control+Return
prev=Up Control+p
next=Down Control+n
prev-page=Page_Up
next-page=Page_Down
delete-line-backward=Control+u
