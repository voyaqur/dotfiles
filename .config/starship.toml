# ~/.config/starship.toml
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[.](bright-black) "

format = "$all$line_break$character"
[character]
success_symbol = '[>](bold #859900) [\$](#839496)'  # Cyan chevron, Base0 dollar sign
error_symbol = '[>](bold #dc322f) [\$](#839496)'    # Red chevron (on error), Base0 dollar sign
# Vi Normal Mode
vimcmd_symbol = '[<](bold #2aa198) [\$](#b58900)'   # Cyan chevron, Yellow dollar sign

# Vi Visual Mode
vimcmd_visual_symbol = '[<](bold #d33682) [\$](#b58900)' # Pink/Magenta chevron, Yellow dollar sign

# Vi Replace Modes
vimcmd_replace_symbol = '[<](bold #dc322f) [\$](#b58900)'     # Red chevron, Yellow dollar sign
vimcmd_replace_one_symbol = '[<](bold #dc322f) [\$](#b58900)' # Red chevron, Yellow dollar sign
[fill]
disabled=false
symbol=' '
[time]
disabled = false
time_format = '%r'
format="at [ $time]($style) "
[aws]
symbol = " "
